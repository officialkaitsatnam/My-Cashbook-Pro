<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MyCashbook Pro</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #111827;
      --accent: #1d4ed8;
      --green: #15803d;
      --red: #b91c1c;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    .container { max-width: 900px; margin: 0 auto; padding: 6px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
    h2 { font-size: 15.5px; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }
    .field { margin-bottom: 6px; }
    label { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 2px; color: #1f2937; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13.5px; background: #fff; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 9px 12px; border: none; border-radius: 8px; font-weight: 700;
      font-size: 13px; cursor: pointer; background: var(--primary); color: #fff;
    }
    .btn:active { opacity: 0.9; }
    .btn-secondary { background: #eff6ff; color: var(--accent); }
    .btn-danger { background: #fef2f2; color: var(--red); }
    .btn-sm { width: auto; padding: 4px 8px; font-size: 11.5px; border-radius: 6px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 6px; }
    .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; margin-bottom: 6px; }
    .tab { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 11.5px; white-space: nowrap; font-weight: 600; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .kpi { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: #f9fafb; }
    .kpi span { font-size: 10.5px; color: var(--muted); }
    .kpi .val { font-size: 14px; font-weight: 800; margin-top: 1px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 5px 4px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-weight: 600; font-size: 11px; }
    .hidden { display: none !important; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 5px; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; padding: 10px; z-index: 50; }
    .modal-card { background: #fff; border-radius: 12px; padding: 12px; width: 100%; max-width: 380px; }
    .bar-chart { display: flex; flex-direction: column; gap: 5px; margin-top: 3px; }
    .bar-row { display: grid; grid-template-columns: 82px 1fr 68px; align-items: center; gap: 6px; font-size: 11.5px; }
    .bar-track { height: 7px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; }
    @media print {
      @page { size: portrait; margin: 8mm; }
      .no-print { display: none !important; }
      body { background: #fff; }
      .card { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- DIRECT CASHBOOK & UDHAR KHATA APP (NO LOGIN SCREEN) -->
  <div class="card no-print">
    <div class="toolbar">
      <div>
        <h2>MyCashbook Pro</h2>
        <div class="sub" style="margin:0;">Direct Open • Fast Offline Mode • English Labels • Hindi Entries</div>
      </div>
      <div style="display:flex; gap:4px; flex-wrap:wrap;">
        <button type="button" class="btn btn-sm btn-secondary" onclick="exportCSV()">Excel</button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="window.print()">Print</button>
      </div>
    </div>

    <div id="monthTabs" class="tabs"></div>

    <div class="row">
      <div class="kpi"><span>Carry-Forward</span><div class="val" id="valCarry">₹0</div></div>
      <div class="kpi"><span>Cash In</span><div class="val" style="color:var(--green);" id="valIn">₹0</div></div>
      <div class="kpi"><span>Cash Out</span><div class="val" style="color:var(--red);" id="valOut">₹0</div></div>
      <div class="kpi"><span>Net Udhar Khata</span><div class="val" style="color:var(--accent);" id="valUdhar">₹0</div></div>
    </div>
  </div>

  <div class="card no-print">
    <h2>Add Entry</h2>
    <div class="row">
      <div class="field"><label for="fDate">Date</label><input type="date" id="fDate" /></div>
      <div class="field">
        <label for="fType">Type</label>
        <select id="fType">
          <option value="CASH_IN">Cash In (आवक)</option>
          <option value="CASH_OUT">Cash Out (खर्च)</option>
          <option value="UDHAR_GIVEN">Udhar Given (उधार दिया)</option>
          <option value="UDHAR_TAKEN">Udhar Taken (उधार लिया)</option>
        </select>
      </div>
      <div class="field"><label for="fAmount">Amount (₹)</label><input type="number" id="fAmount" min="0" step="0.01" placeholder="0.00" /></div>
    </div>
    <div class="row">
      <div class="field"><label for="fParty">Party / Name</label><input type="text" id="fParty" placeholder="उदा. रमेश / Name" /></div>
      <div class="field"><label for="fNote">Remark</label><input type="text" id="fNote" placeholder="उदा. विवरण / Note" /></div>
    </div>
    <button type="button" class="btn" onclick="addTxn()">Save Entry</button>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2 id="tableTitle" style="margin:0;">Recent Entries (Last 5)</h2>
      <div class="no-print" style="display:flex; gap:4px;">
        <select id="fFilter" onchange="renderDashboard()" style="width:auto; padding:4px 8px; font-size:11.5px;">
          <option value="ALL">All</option>
          <option value="UDHAR">Udhar Khata</option>
          <option value="CASH">Cashbook</option>
        </select>
        <button type="button" class="btn btn-sm btn-secondary" id="btnToggleRows" onclick="toggleAllRows()">Show All</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Party</th><th>Type</th><th>Remark</th><th>Amount</th><th class="no-print">Edit</th>
          </tr>
        </thead>
        <tbody id="txnBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card no-print">
    <h2>Monthly Summary</h2>
    <div id="chartArea" class="bar-chart"></div>
  </div>

</div>

<!-- EDIT POPUP MODAL -->
<div id="editModal" class="modal-backdrop hidden">
  <div class="modal-card">
    <h2>Edit Entry</h2>
    <input type="hidden" id="eId" />
    <div class="field"><label>Date</label><input type="date" id="eDate" /></div>
    <div class="field">
      <label>Type</label>
      <select id="eType">
        <option value="CASH_IN">Cash In (आवक)</option>
        <option value="CASH_OUT">Cash Out (खर्च)</option>
        <option value="UDHAR_GIVEN">Udhar Given (उधार दिया)</option>
        <option value="UDHAR_TAKEN">Udhar Taken (उधार लिया)</option>
      </select>
    </div>
    <div class="field"><label>Amount (₹)</label><input type="number" id="eAmount" step="0.01" /></div>
    <div class="field"><label>Party / Name</label><input type="text" id="eParty" /></div>
    <div class="field"><label>Remark</label><input type="text" id="eNote" /></div>
    <div style="display:flex; gap:6px; margin-top:8px;">
      <button type="button" class="btn" onclick="saveTxnEdit()">Update</button>
      <button type="button" class="btn btn-danger" onclick="deleteTxnEdit()">Delete</button>
      <button type="button" class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
    </div>
  </div>
</div>

<script>
  const STORE_KEY = "mycashbook_pro_direct_v8";
  let store = JSON.parse(localStorage.getItem(STORE_KEY) || "null") || {
    activeMonth: new Date().toISOString().slice(0, 7),
    months: [new Date().toISOString().slice(0, 7)],
    txns: []
  };
  let showAllRows = false;

  function saveStore() {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  }

  function addMonthIfMissing(ym) {
    if (!store.months.includes(ym)) {
      store.months.push(ym);
      store.months.sort();
    }
  }

  function txnDelta(t) {
    const amt = Number(t.amount) || 0;
    return (t.type === "CASH_IN" || t.type === "UDHAR_GIVEN") ? amt : -amt;
  }

  function addTxn() {
    const date = document.getElementById("fDate").value;
    const type = document.getElementById("fType").value;
    const amount = parseFloat(document.getElementById("fAmount").value);
    const party = document.getElementById("fParty").value.trim() || "-";
    const note = document.getElementById("fNote").value.trim() || "-";

    if (!date || isNaN(amount) || amount <= 0) return alert("Enter valid date and amount.");
    const ym = date.slice(0, 7);
    addMonthIfMissing(ym);
    store.activeMonth = ym;
    store.txns.push({ id: String(Date.now()), date, month: ym, type, amount, party, note });
    saveStore();

    document.getElementById("fAmount").value = "";
    document.getElementById("fParty").value = "";
    document.getElementById("fNote").value = "";
    renderDashboard();
  }

  function openEdit(id) {
    const item = store.txns.find(x => x.id === id);
    if (!item) return;
    document.getElementById("eId").value = item.id;
    document.getElementById("eDate").value = item.date;
    document.getElementById("eType").value = item.type;
    document.getElementById("eAmount").value = item.amount;
    document.getElementById("eParty").value = item.party === "-" ? "" : item.party;
    document.getElementById("eNote").value = item.note === "-" ? "" : item.note;
    document.getElementById("editModal").classList.remove("hidden");
  }

  function closeEdit() {
    document.getElementById("editModal").classList.add("hidden");
  }

  function saveTxnEdit() {
    const id = document.getElementById("eId").value;
    const idx = store.txns.findIndex(x => x.id === id);
    if (idx === -1) return;
    const date = document.getElementById("eDate").value;
    const type = document.getElementById("eType").value;
    const amount = parseFloat(document.getElementById("eAmount").value);
    const party = document.getElementById("eParty").value.trim() || "-";
    const note = document.getElementById("eNote").value.trim() || "-";
    if (!date || isNaN(amount) || amount <= 0) return alert("Invalid date or amount.");
    const ym = date.slice(0, 7);
    addMonthIfMissing(ym);
    store.txns[idx] = { ...store.txns[idx], date, month: ym, type, amount, party, note };
    saveStore();
    closeEdit();
    renderDashboard();
  }

  function deleteTxnEdit() {
    const id = document.getElementById("eId").value;
    store.txns = store.txns.filter(x => x.id !== id);
    saveStore();
    closeEdit();
    renderDashboard();
  }

  function toggleAllRows() {
    showAllRows = !showAllRows;
    document.getElementById("btnToggleRows").textContent = showAllRows ? "Last 5 Only" : "Show All";
    renderDashboard();
  }

  function renderDashboard() {
    document.getElementById("monthTabs").innerHTML = store.months.map(m =>
      `<button type="button" class="tab ${m === store.activeMonth ? "active" : ""}" onclick="store.activeMonth='${m}';renderDashboard();">${m}</button>`
    ).join("");

    const m = store.activeMonth;
    const carry = store.txns.filter(t => t.month < m).reduce((s, t) => s + txnDelta(t), 0);
    const cur = store.txns.filter(t => t.month === m);

    let cIn = 0, cOut = 0, uGiv = 0, uTak = 0;
    cur.forEach(t => {
      if (t.type === "CASH_IN") cIn += t.amount;
      if (t.type === "CASH_OUT") cOut += t.amount;
      if (t.type === "UDHAR_GIVEN") uGiv += t.amount;
      if (t.type === "UDHAR_TAKEN") uTak += t.amount;
    });

    document.getElementById("valCarry").textContent = `₹${carry.toLocaleString("en-IN")}`;
    document.getElementById("valIn").textContent = `₹${cIn.toLocaleString("en-IN")}`;
    document.getElementById("valOut").textContent = `₹${cOut.toLocaleString("en-IN")}`;
    document.getElementById("valUdhar").textContent = `₹${(uGiv - uTak).toLocaleString("en-IN")}`;

    const filter = document.getElementById("fFilter").value;
    let list = [...cur].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    if (filter === "UDHAR") list = list.filter(t => t.type.startsWith("UDHAR"));
    if (filter === "CASH") list = list.filter(t => t.type.startsWith("CASH"));

    const rows = showAllRows ? list : list.slice(0, 5);
    document.getElementById("tableTitle").textContent = showAllRows ? `All Entries (${m})` : `Recent Entries - Last 5 (${m})`;

    document.getElementById("txnBody").innerHTML = rows.length
      ? rows.map(t => `
          <tr>
            <td>${t.date}</td>
            <td>${t.party}</td>
            <td>${t.type.replace("_", " ")}</td>
            <td>${t.note}</td>
            <td>₹${t.amount.toLocaleString("en-IN")}</td>
            <td class="no-print"><button type="button" class="btn btn-sm btn-secondary" onclick="openEdit('${t.id}')">Edit</button></td>
          </tr>
        `).join("")
      : `<tr><td colspan="6" style="text-align:center;color:#6b7280;">No entries found.</td></tr>`;

    const maxV = Math.max(cIn, cOut, uGiv, uTak, 1);
    const items = [
      { label: "Cash In", val: cIn, color: "#15803d" },
      { label: "Cash Out", val: cOut, color: "#b91c1c" },
      { label: "Udhar Given", val: uGiv, color: "#1d4ed8" },
      { label: "Udhar Taken", val: uTak, color: "#d97706" }
    ];
    document.getElementById("chartArea").innerHTML = items.map(it => `
      <div class="bar-row">
        <span>${it.label}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(it.val / maxV) * 100}%;background:${it.color};"></div></div>
        <strong style="text-align:right;">₹${it.val.toLocaleString("en-IN")}</strong>
      </div>
    `).join("");
  }

  function exportCSV() {
    const rows = [["Month", "Date", "Type", "Party", "Remark", "Amount"]];
    store.txns.forEach(t => rows.push([t.month, t.date, t.type, t.party, t.note, t.amount]));
    const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("
");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    a.download = `MyCashbook_${store.activeMonth}.csv`;
    a.click();
  }

  // Direct boot with zero login screen
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("fDate").value = today;
  addMonthIfMissing(today.slice(0, 7));
  renderDashboard();
</script>
</body>
</html>
