name: Auto Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Sync Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Apply App Icon & Adaptive Icon from assets/
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#0a2e7a' --splashBackgroundColor '#0a2e7a'

      - name: Auto-Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/auto-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias mycashbook \
            -storepass Cashbook@2026 -keypass Cashbook@2026 \
            -dname "CN=MyCashbook Pro, OU=App, O=MyCashbook, L=India, S=HR, C=IN"

      - name: Enable Signing & R8 Speed Optimization
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("auto-release.jks")
                      storePassword "Cashbook@2026"
                      keyAlias "mycashbook"
                      keyPassword "Cashbook@2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCashbook-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
