name: Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Init Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Generate App Icons & Splash from assets/icon.png
        run: |
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#0b3b9c' --splashBackgroundColor '#0b3b9c'
          fi

      - name: Decode Keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks

      - name: Inject Signing Config & ProGuard Optimization into build.gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCashbook-Pro-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
