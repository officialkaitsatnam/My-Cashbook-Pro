name: Auto Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets (www) & Icon
        run: |
          rm -rf www assets
          mkdir -p www assets android/app
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f app.js ] && cp app.js www/app.js || true
          [ -f style.css ] && cp style.css www/style.css || true
          if [ -f icon.png ]; then
            cp icon.png www/icon.png
            cp icon.png assets/icon.png
            cp icon.png assets/logo.png
          fi

      - name: Install Dependencies & Sync Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Generate Launcher Icons from assets/icon.png
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#062a78' --splashBackgroundColor '#062a78' || true

      - name: Auto-Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore android/app/auto-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias mycashbook \
            -storepass Cashbook@2026 -keypass Cashbook@2026 \
            -dname "CN=MyCashbook Pro, OU=App, O=MyCashbook, L=India, S=HR, C=IN"

      - name: Configure Release Signing & Version Code in build.gradle
        run: |
          node -e '
            const fs = require("fs");
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            const nextCode = Math.floor(Date.now() / 1000) % 2100000000;
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + nextCode);

            const signingSnippet = `
    signingConfigs {
        release {
            storeFile file("auto-release.jks")
            storePassword "Cashbook@2026"
            keyAlias "mycashbook"
            keyPassword "Cashbook@2026"
        }
    }`;
            if (!gradle.includes("signingConfigs {")) {
              gradle = gradle.replace(/android\s*\{/, "android {" + signingSnippet);
            }
            gradle = gradle.replace(
              /buildTypes\s*\{[\s\S]*?release\s*\{/,
              (match) => match + "\n            signingConfig signingConfigs.release"
            );
            fs.writeFileSync(gradlePath, gradle, "utf8");
          '

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCashbook-Pro-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
